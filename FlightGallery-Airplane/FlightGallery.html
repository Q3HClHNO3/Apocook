<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#d9edf6" />
  <title>FlightGallery | In-Flight Narrative Gallery</title>
  <script src="../database.js"></script>
  <style>
    :root {
      --ink: #233342;
      --muted: #627586;
      --panel: rgba(255, 255, 255, 0.46);
      --line: rgba(255, 255, 255, 0.62);
      --ease: cubic-bezier(0.22, 1, 0.36, 1);
      --flight: cubic-bezier(0.16, 1, 0.3, 1);
      --direction: 1;
    }

    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    html,
    body {
      min-height: 100%;
      margin: 0;
    }

    body {
      min-width: 320px;
      overflow: hidden;
      color: var(--ink);
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI",
        "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
      background:
        radial-gradient(circle at 22% 18%, rgba(255, 255, 255, 0.74), transparent 25rem),
        radial-gradient(circle at 86% 12%, rgba(111, 184, 219, 0.22), transparent 22rem),
        linear-gradient(135deg, #dceff7 0%, #f7dce4 48%, #fff2d5 100%);
      transition: background 760ms var(--ease);
    }

    button {
      border: 0;
      font: inherit;
      cursor: pointer;
    }

    .stage {
      position: relative;
      display: grid;
      min-height: 100vh;
      min-height: 100svh;
      place-items: center;
      padding: max(18px, env(safe-area-inset-top)) 16px max(18px, env(safe-area-inset-bottom));
      overflow: hidden;
    }

    .cabin {
      position: relative;
      width: min(1280px, 100%);
      height: min(840px, calc(100svh - 36px));
      min-height: 650px;
      overflow: hidden;
      border: 1px solid rgba(255, 255, 255, 0.58);
      border-radius: 32px;
      background: rgba(255, 255, 255, 0.28);
      box-shadow: 0 34px 100px rgba(70, 113, 140, 0.28);
      backdrop-filter: blur(24px);
      isolation: isolate;
    }

    .cabin::before {
      content: "";
      position: absolute;
      inset: 0;
      z-index: 2;
      pointer-events: none;
      background:
        linear-gradient(90deg, rgba(255, 255, 255, 0.34), transparent 16%, transparent 84%, rgba(67, 150, 195, 0.18)),
        radial-gradient(circle at 50% 42%, transparent 0 52%, rgba(255, 255, 255, 0.3) 78%);
    }

    .cabin::after {
      content: "";
      position: absolute;
      inset: 0;
      z-index: 3;
      pointer-events: none;
      opacity: 0.76;
      background:
        linear-gradient(90deg, transparent 0 9%, rgba(255, 255, 255, 0.22) 9.2%, transparent 9.6%),
        linear-gradient(90deg, transparent 0 90%, rgba(74, 133, 167, 0.12) 90.2%, transparent 90.7%),
        linear-gradient(180deg, transparent 0 72%, rgba(255, 255, 255, 0.34) 72.2%, rgba(90, 143, 174, 0.1) 72.45%, transparent 72.8%);
      mask-image: linear-gradient(90deg, transparent, #000 8%, #000 92%, transparent);
    }

    .cabin-art {
      position: absolute;
      inset: 0;
      transform: translateX(calc(var(--active, 0) * -42px));
      transition: transform 900ms var(--flight);
      will-change: transform;
    }

    .cabin-art::before,
    .cabin-art::after {
      content: "";
      position: absolute;
      left: 50%;
      pointer-events: none;
      transform: translateX(-50%);
      border-radius: 50%;
    }

    .cabin-art::before {
      top: -52%;
      width: 118%;
      height: 98%;
      border: 1px solid rgba(255, 255, 255, 0.28);
      box-shadow: inset 0 -28px 70px rgba(255, 255, 255, 0.18);
    }

    .cabin-art::after {
      bottom: -56%;
      width: 126%;
      height: 88%;
      border-top: 1px solid rgba(82, 136, 166, 0.12);
      box-shadow: 0 -18px 40px rgba(255, 255, 255, 0.18);
    }

    .cabin-wash {
      position: absolute;
      inset: 0;
      background:
        radial-gradient(ellipse at 50% 18%, rgba(255, 255, 255, 0.62), transparent 34rem),
        linear-gradient(100deg, rgba(171, 213, 232, 0.52), rgba(255, 218, 224, 0.32) 42%, rgba(244, 250, 252, 0.7) 68%, rgba(142, 191, 221, 0.44));
    }

    .seat {
      position: absolute;
      top: 13%;
      height: 78%;
      border-radius: 42% 36% 18% 18%;
      background: linear-gradient(90deg, rgba(70, 155, 205, 0.34), rgba(219, 240, 250, 0.45), rgba(255, 218, 224, 0.5));
      box-shadow: inset -34px 0 60px rgba(20, 80, 130, 0.18);
      transition: transform 900ms var(--flight), filter 900ms var(--flight);
      will-change: transform, filter;
    }

    .seat::before {
      content: "";
      position: absolute;
      inset: 2% 10% auto 12%;
      height: 24%;
      border-radius: 52% 46% 34% 34%;
      background: rgba(255, 255, 255, 0.2);
      box-shadow: inset 0 12px 18px rgba(255, 255, 255, 0.2);
    }

    .seat::after {
      content: "";
      position: absolute;
      inset: 0 7% 0 auto;
      width: 1px;
      border-radius: 999px;
      background: linear-gradient(180deg, transparent, rgba(255, 255, 255, 0.52), transparent);
    }

    .seat.left {
      left: -7%;
      width: 30%;
    }

    .seat.right {
      right: -8%;
      top: 8%;
      width: 33%;
      height: 86%;
      background: linear-gradient(270deg, rgba(65, 150, 205, 0.38), rgba(219, 240, 250, 0.52), rgba(255, 218, 224, 0.45));
      box-shadow: inset 38px 0 70px rgba(15, 67, 115, 0.2);
    }

    .cabin.is-moving .seat.left {
      transform: translateX(calc(var(--direction) * -28px)) rotate(calc(var(--direction) * -1.6deg)) scale(1.012);
      filter: blur(0.4px);
    }

    .cabin.is-moving .seat.right {
      transform: translateX(calc(var(--direction) * -44px)) rotate(calc(var(--direction) * 1.4deg)) scale(1.018);
      filter: blur(0.5px);
    }

    .armrest {
      position: absolute;
      bottom: 15%;
      left: 14%;
      width: 28%;
      height: 16px;
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.55);
      box-shadow: 0 8px 20px rgba(62, 113, 145, 0.16);
    }

    .tray {
      position: absolute;
      right: 24%;
      bottom: 28%;
      width: 24%;
      height: 12%;
      border-radius: 8px;
      background: rgba(255, 255, 255, 0.45);
      box-shadow: 0 14px 35px rgba(83, 112, 132, 0.18);
    }

    .tray::before {
      content: "";
      position: absolute;
      inset: 10px 14px auto;
      height: 1px;
      background: rgba(255, 255, 255, 0.52);
    }

    .can {
      position: absolute;
      right: 29%;
      bottom: 26%;
      width: 28px;
      height: 48px;
      border-radius: 999px 999px 8px 8px;
      background: rgba(255, 226, 232, 0.72);
      box-shadow: inset 0 8px 18px rgba(255, 255, 255, 0.8);
    }

    .glasses {
      position: absolute;
      right: 33%;
      bottom: 24%;
      width: 80px;
      height: 12px;
      border-radius: 999px;
      background: rgba(250, 221, 116, 0.56);
    }

    .content {
      position: relative;
      z-index: 5;
      display: grid;
      height: 100%;
      grid-template-rows: auto 1fr auto;
    }

    .topbar {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 16px;
      padding: 24px clamp(20px, 4vw, 40px);
    }

    .brand {
      margin: 0;
      color: #64798a;
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 0.24em;
      text-transform: uppercase;
    }

    h1 {
      margin: 4px 0 0;
      font-size: clamp(25px, 4vw, 40px);
      line-height: 1.08;
      font-weight: 720;
      letter-spacing: 0;
    }

    .flight-chip {
      flex: 0 0 auto;
      border: 1px solid var(--line);
      border-radius: 999px;
      padding: 9px 16px;
      text-align: right;
      background: rgba(255, 255, 255, 0.45);
      box-shadow: 0 12px 30px rgba(36, 82, 112, 0.08);
      backdrop-filter: blur(16px);
    }

    .flight-chip span {
      display: block;
      color: #637788;
      font-size: 11px;
      letter-spacing: 0.22em;
    }

    .flight-chip strong {
      display: block;
      margin-top: 3px;
      font-size: 14px;
      font-weight: 600;
    }

    .gallery-layout {
      display: grid;
      min-height: 0;
      grid-template-columns: 1fr minmax(360px, 450px);
      align-items: center;
      gap: clamp(22px, 4vw, 46px);
      padding: 0 clamp(20px, 4vw, 46px) 18px;
    }

    .window-zone {
      display: flex;
      min-width: 0;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 16px;
    }

    .window-frame {
      position: relative;
      width: min(430px, 64vw);
      min-width: 270px;
      aspect-ratio: 0.78;
      cursor: grab;
      user-select: none;
      touch-action: pan-y;
      transform: translateX(0) rotate(0deg);
      transition: transform 760ms var(--flight);
      will-change: transform;
    }

    .window-frame:active {
      cursor: grabbing;
    }

    .cabin.is-moving .window-frame {
      transform: translateX(calc(var(--direction) * -18px)) rotate(calc(var(--direction) * -0.45deg));
    }

    .window-halo,
    .window-ring {
      position: absolute;
      pointer-events: none;
    }

    .window-halo {
      inset: -22px;
      border-radius: 46% / 30%;
      background:
        radial-gradient(ellipse at 48% 18%, rgba(255, 255, 255, 0.78), rgba(255, 255, 255, 0.3) 42%, rgba(166, 210, 231, 0.3));
      box-shadow: inset 0 0 34px rgba(255, 255, 255, 0.95), 0 18px 50px rgba(48, 103, 139, 0.18);
    }

    .window-ring {
      inset: -10px;
      border: 1px solid rgba(255, 255, 255, 0.72);
      border-radius: 45% / 29%;
      background: linear-gradient(180deg, rgba(255, 255, 255, 0.84), rgba(239, 248, 252, 0.66), rgba(183, 221, 239, 0.42));
      box-shadow: inset 0 2px 12px rgba(255, 255, 255, 0.9), inset 0 -22px 50px rgba(82, 129, 160, 0.25), 0 24px 70px rgba(67, 107, 132, 0.32);
    }

    .window-ring::before,
    .window-ring::after {
      content: "";
      position: absolute;
      pointer-events: none;
      border-radius: 45% / 29%;
    }

    .window-ring::before {
      inset: 11px;
      border: 1px solid rgba(105, 154, 184, 0.2);
      box-shadow: inset 0 0 0 7px rgba(255, 255, 255, 0.22);
    }

    .window-ring::after {
      inset: 26px;
      border-left: 2px solid rgba(255, 255, 255, 0.5);
      border-right: 2px solid rgba(67, 122, 155, 0.13);
    }

    .window-mask {
      position: absolute;
      inset: 18px;
      overflow: hidden;
      border-radius: 45% / 29%;
      background: #d9eef8;
      box-shadow: inset 0 0 0 4px rgba(255, 255, 255, 0.72), inset 0 0 22px rgba(42, 102, 140, 0.32);
    }

    .window-mask::before {
      content: "";
      position: absolute;
      inset: -10% -28%;
      z-index: 2;
      pointer-events: none;
      opacity: 0.34;
      background:
        linear-gradient(100deg, transparent 0 16%, rgba(255, 255, 255, 0.56) 22%, transparent 30%),
        linear-gradient(100deg, transparent 34%, rgba(255, 244, 231, 0.34) 46%, transparent 58%),
        radial-gradient(ellipse at 70% 26%, rgba(255, 255, 255, 0.35), transparent 24%);
      transform: translateX(0);
      transition: transform 900ms var(--flight), opacity 560ms var(--ease);
    }

    .window-mask.is-changing::before {
      opacity: 0.58;
      transform: translateX(calc(var(--direction) * -48px));
    }

    .window-mask img {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      transform: translateX(0) scale(1);
      opacity: 1;
      filter: blur(0);
      transition: opacity 720ms var(--ease), transform 720ms var(--ease), filter 720ms var(--ease);
    }

    .window-mask.is-changing img {
      opacity: 0;
      transform: translateX(calc(var(--direction) * 92px)) scale(1.07);
      filter: blur(10px) saturate(0.9);
    }

    .window-shade {
      position: absolute;
      top: 0;
      left: 50%;
      width: 74%;
      height: 96px;
      transform: translateX(-50%);
      border-radius: 0 0 48% 48%;
      background: rgba(255, 255, 255, 0.28);
      backdrop-filter: blur(1px);
      pointer-events: none;
    }

    .window-gloss {
      position: absolute;
      inset: 0;
      pointer-events: none;
      background:
        linear-gradient(102deg, rgba(255, 255, 255, 0.34), transparent 24%, transparent 74%, rgba(255, 255, 255, 0.16)),
        linear-gradient(180deg, rgba(255, 255, 255, 0.2), transparent 32%, rgba(7, 34, 58, 0.24));
    }

    .arrow {
      position: absolute;
      top: 50%;
      z-index: 10;
      display: grid;
      width: 46px;
      height: 46px;
      place-items: center;
      transform: translateY(-50%);
      border: 1px solid rgba(255, 255, 255, 0.72);
      border-radius: 999px;
      color: rgba(44, 67, 83, 0.84);
      background: rgba(255, 255, 255, 0.48);
      box-shadow: 0 16px 38px rgba(58, 104, 132, 0.16);
      backdrop-filter: blur(14px);
      transition: transform 220ms var(--ease), background 220ms ease, color 220ms ease;
    }

    .arrow:hover,
    .arrow:focus-visible {
      transform: translateY(-50%) scale(1.06);
      color: rgba(18, 41, 58, 0.94);
      background: rgba(255, 255, 255, 0.72);
      outline: none;
    }

    .arrow.prev {
      left: -60px;
    }

    .arrow.next {
      right: -60px;
    }

    .photo-dots {
      position: absolute;
      bottom: 22px;
      left: 50%;
      z-index: 4;
      display: flex;
      gap: 8px;
      padding: 8px 12px;
      transform: translateX(-50%);
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.45);
      backdrop-filter: blur(12px);
    }

    .photo-dots button {
      width: 10px;
      height: 10px;
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.55);
      transition: width 260ms var(--ease), background 260ms ease;
    }

    .photo-dots button.is-active {
      width: 32px;
      background: #fff;
    }

    .hint {
      margin: 0;
      border: 1px solid var(--line);
      border-radius: 999px;
      padding: 9px 15px;
      color: #5f7486;
      font-size: 14px;
      background: rgba(255, 255, 255, 0.4);
      backdrop-filter: blur(14px);
    }

    .info-panel {
      border: 1px solid var(--line);
      border-radius: 24px;
      padding: 24px;
      background: var(--panel);
      box-shadow: 0 24px 60px rgba(35, 82, 113, 0.12);
      backdrop-filter: blur(24px);
      transform: translateY(0);
      opacity: 1;
      filter: blur(0);
      transition: opacity 520ms var(--ease), transform 520ms var(--ease), filter 520ms var(--ease);
    }

    .info-panel.is-changing {
      opacity: 0;
      transform: translate(calc(var(--direction) * 18px), 20px);
      filter: blur(8px);
    }

    .kicker {
      margin: 0;
      color: rgba(2, 107, 161, 0.7);
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 0.24em;
      text-transform: uppercase;
    }

    .city-name {
      margin: 9px 0 0;
      font-size: clamp(34px, 5vw, 48px);
      line-height: 1;
      font-weight: 720;
      letter-spacing: 0;
    }

    .city-en {
      margin: 5px 0 0;
      color: #647788;
      font-size: 18px;
    }

    .guide-list {
      display: grid;
      gap: 12px;
      margin-top: 26px;
    }

    .guide-list p {
      margin: 0;
      border: 1px solid rgba(255, 255, 255, 0.56);
      border-radius: 14px;
      padding: 13px 15px;
      color: #384d5f;
      font-size: 14px;
      line-height: 1.55;
      background: rgba(255, 255, 255, 0.38);
    }

    .decision {
      margin-top: 20px;
      border-radius: 16px;
      padding: 16px;
      color: #fff;
      background: rgba(30, 44, 58, 0.82);
      box-shadow: 0 20px 45px rgba(22, 45, 61, 0.12);
    }

    .decision span {
      display: block;
      color: rgba(220, 243, 255, 0.72);
      font-size: 11px;
      letter-spacing: 0.2em;
      text-transform: uppercase;
    }

    .decision p {
      margin: 9px 0 0;
      color: rgba(255, 255, 255, 0.88);
      font-size: 14px;
      line-height: 1.7;
    }

    .rail {
      position: relative;
      z-index: 8;
      display: flex;
      justify-content: center;
      gap: 12px;
      padding: 0 20px 24px;
    }

    .node {
      min-width: 144px;
      border: 1px solid rgba(255, 255, 255, 0.46);
      border-radius: 999px;
      padding: 12px 20px;
      text-align: left;
      color: #5f7181;
      background: rgba(255, 255, 255, 0.25);
      backdrop-filter: blur(14px);
      transition: border-color 420ms var(--ease), background 420ms var(--ease), color 420ms var(--ease), box-shadow 420ms var(--ease), transform 220ms var(--ease);
    }

    .node:hover {
      transform: translateY(-2px);
      background: rgba(255, 255, 255, 0.42);
    }

    .node.is-active {
      border-color: rgba(255, 255, 255, 0.82);
      color: #243648;
      background: rgba(255, 255, 255, 0.7);
      box-shadow: 0 16px 36px rgba(35, 82, 113, 0.12);
    }

    .node span {
      display: block;
      color: #647788;
      font-size: 11px;
      letter-spacing: 0.22em;
    }

    .node strong {
      display: block;
      margin-top: 3px;
      font-size: 14px;
      font-weight: 700;
    }

    @media (max-width: 900px) {
      body {
        overflow: auto;
      }

      .stage {
        min-height: 100vh;
        align-items: start;
        overflow: visible;
      }

      .cabin {
        height: auto;
        min-height: 100svh;
        overflow: hidden;
      }

      .topbar {
        flex-direction: column;
      }

      .flight-chip {
        text-align: left;
      }

      .gallery-layout {
        grid-template-columns: 1fr;
        padding-bottom: 24px;
      }

      .window-frame {
        width: min(360px, 72vw);
      }

      .arrow {
        top: auto;
        bottom: -60px;
      }

      .arrow.prev {
        left: calc(50% - 56px);
      }

      .arrow.next {
        right: calc(50% - 56px);
      }

      .hint {
        margin-top: 48px;
        text-align: center;
      }

      .rail {
        flex-wrap: wrap;
      }
    }

    @media (max-width: 520px) {
      .stage {
        padding: 0;
      }

      .cabin {
        width: 100%;
        min-height: 100svh;
        border-radius: 0;
      }

      .window-frame {
        width: min(320px, 78vw);
      }

      .info-panel {
        padding: 20px;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      *,
      *::before,
      *::after {
        animation-duration: 1ms !important;
        scroll-behavior: auto !important;
        transition-duration: 1ms !important;
      }
    }
  </style>
</head>
<body>
  <main class="stage">
    <section class="cabin" id="cabin">
      <div class="cabin-art" id="cabinArt" aria-hidden="true">
        <div class="cabin-wash"></div>
        <div class="seat left"></div>
        <div class="seat right"></div>
        <div class="armrest"></div>
        <div class="tray"></div>
        <div class="glasses"></div>
        <div class="can"></div>
      </div>

      <div class="content">
        <header class="topbar">
          <div>
            <p class="brand">FlightGallery</p>
            <h1>In-Flight Narrative Gallery</h1>
          </div>
          <div class="flight-chip">
            <span id="airportCode">IST</span>
            <strong id="flightMood">夜航转晨光</strong>
          </div>
        </header>

        <div class="gallery-layout">
          <section class="window-zone" aria-label="飞机舷窗摄影画廊">
            <div class="window-frame" id="windowFrame">
              <div class="window-halo"></div>
              <div class="window-ring"></div>
              <button class="arrow prev" type="button" id="previousDestination" aria-label="上一个目的地">‹</button>
              <button class="arrow next" type="button" id="nextDestination" aria-label="下一个目的地">›</button>
              <div class="window-mask" id="windowMask">
                <img id="galleryImage" alt="城市建筑摄影" />
                <div class="window-shade"></div>
                <div class="window-gloss"></div>
                <div class="photo-dots" id="photoDots" aria-label="照片切换"></div>
              </div>
            </div>
            <p class="hint">拖动舷窗、按左右箭头，或点击座位节点切换目的地</p>
          </section>

          <aside class="info-panel" id="infoPanel">
            <p class="kicker">Window Node</p>
            <h2 class="city-name" id="cityLabel">伊斯坦布尔</h2>
            <p class="city-en" id="cityEnglish">Istanbul</p>
            <div class="guide-list" id="guideList"></div>
            <div class="decision">
              <span>Flight Decision</span>
              <p id="flightDecision"></p>
            </div>
          </aside>
        </div>

        <nav class="rail" id="destinationRail" aria-label="目的地节点"></nav>
      </div>
    </section>
  </main>

  <script>
    const DATA_URL = "./cityData.json";

    let cityData = {
      generatedAt: "mock",
      source: "FlightGallery local mock",
      destinations: [
        {
          id: "istanbul",
          city: "Istanbul",
          label: "伊斯坦布尔",
          code: "IST",
          flight: "夜航转晨光",
          background: "radial-gradient(circle at 22% 18%, rgba(255,255,255,0.74), transparent 25rem), radial-gradient(circle at 86% 12%, rgba(111,184,219,0.22), transparent 22rem), linear-gradient(135deg, #dceff7 0%, #f7dce4 48%, #fff2d5 100%)",
          photos: [
            "https://images.unsplash.com/photo-1524231757912-21f4fe3a7200?auto=format&fit=crop&w=1400&q=82",
            "https://images.unsplash.com/photo-1541432901042-2d8bd64b4a9b?auto=format&fit=crop&w=1400&q=82",
            "https://images.unsplash.com/photo-1527838832700-5059252407fa?auto=format&fit=crop&w=1400&q=82"
          ],
          guide: ["清晨去苏丹艾哈迈德广场", "傍晚留给加拉塔桥与海风", "把香料市场放进半日散步线"],
          ingredientIds: ["curry_leaf", "coconut"],
          decision: "适合 3-5 天城市停留；优先选择抵达时间在清晨的航班。"
        },
        {
          id: "london",
          city: "London",
          label: "伦敦",
          code: "LHR",
          flight: "云层下的灰蓝航线",
          background: "radial-gradient(circle at 24% 16%, rgba(255,255,255,0.76), transparent 25rem), radial-gradient(circle at 82% 10%, rgba(246,191,211,0.2), transparent 22rem), linear-gradient(135deg, #d7f0f7 0%, #e9edf1 50%, #f8dce8 100%)",
          photos: [
            "https://images.unsplash.com/photo-1513635269975-59663e0ac1ad?auto=format&fit=crop&w=1400&q=82",
            "https://images.unsplash.com/photo-1486299267070-83823f5448dd?auto=format&fit=crop&w=1400&q=82",
            "https://images.unsplash.com/photo-1529655683826-aba9b3e77383?auto=format&fit=crop&w=1400&q=82"
          ],
          guide: ["南岸步行连接泰特现代与伦敦桥", "雨天安排博物馆与书店", "黄昏坐上双层巴士看城市灯线"],
          ingredientIds: ["cheddar"],
          decision: "适合转机延展与长周末；优先比较直飞价格和机场到市区时间。"
        }
      ]
    };

    let destinations = cityData.destinations;

    let activeIndex = 0;
    let photoIndex = 0;
    let dragStartX = null;
    let transitionTimer = null;
    let wheelLocked = false;

    const cabin = document.getElementById("cabin");
    const airportCode = document.getElementById("airportCode");
    const flightMood = document.getElementById("flightMood");
    const windowFrame = document.getElementById("windowFrame");
    const windowMask = document.getElementById("windowMask");
    const galleryImage = document.getElementById("galleryImage");
    const photoDots = document.getElementById("photoDots");
    const infoPanel = document.getElementById("infoPanel");
    const cityLabel = document.getElementById("cityLabel");
    const cityEnglish = document.getElementById("cityEnglish");
    const guideList = document.getElementById("guideList");
    const flightDecision = document.getElementById("flightDecision");
    const destinationRail = document.getElementById("destinationRail");

    function normalizeCityData(nextCityData) {
      const list = Array.isArray(nextCityData?.destinations) ? nextCityData.destinations : [];
      return {
        ...nextCityData,
        destinations: list
          .filter((destination) => Array.isArray(destination.photos) && destination.photos.length)
          .map((destination, index) => ({
            id: destination.id || `city-${index}`,
            city: destination.city || destination.label || "Unknown",
            label: destination.label || destination.city || "未命名城市",
            code: destination.code || "AIR",
            flight: destination.flight || "待生成航班策略",
            background: destination.background || "radial-gradient(circle at 24% 16%, rgba(255,255,255,0.76), transparent 25rem), linear-gradient(135deg, #dceff7 0%, #f7dce4 52%, #fff2d5 100%)",
            photos: destination.photos,
            guide: Array.isArray(destination.guide) ? destination.guide : [],
            ingredientIds: Array.isArray(destination.ingredientIds) ? destination.ingredientIds : [],
            decision: destination.decision || "实时航班决策数据待接入。"
          }))
      };
    }

    function applyCityData(nextCityData) {
      const normalized = normalizeCityData(nextCityData);
      if (!normalized.destinations.length) return;
      cityData = normalized;
      destinations = cityData.destinations;
      activeIndex = Math.min(activeIndex, destinations.length - 1);
      photoIndex = 0;
      galleryImage.src = destinations[activeIndex].photos[0];
      galleryImage.alt = `${destinations[activeIndex].label} 建筑摄影`;
      renderInfo();
      renderRail();
      renderDots();
      preloadNearbyImages();
    }

    async function loadCityDataFromJson(url = DATA_URL) {
      try {
        const response = await fetch(url, { cache: "no-store" });
        if (!response.ok) return cityData;
        const nextCityData = await response.json();
        applyCityData(nextCityData);
      } catch (error) {
        return cityData;
      }
      return cityData;
    }

    window.cityData = cityData;
    window.applyCityData = applyCityData;
    window.loadCityDataFromJson = loadCityDataFromJson;

    function renderRail() {
      const nodes = destinations.map((destination, index) => {
        const button = document.createElement("button");
        const code = document.createElement("span");
        const label = document.createElement("strong");
        button.className = `node ${index === activeIndex ? "is-active" : ""}`;
        button.type = "button";
        button.dataset.index = index;
        code.textContent = destination.code;
        label.textContent = destination.label;
        button.append(code, label);
        button.addEventListener("click", () => {
          setDestination(Number(button.dataset.index));
        });
        return button;
      });

      destinationRail.replaceChildren(...nodes);
    }

    function renderDots() {
      const active = destinations[activeIndex];
      const dots = active.photos.map((_, index) => {
        const button = document.createElement("button");
        button.className = index === photoIndex ? "is-active" : "";
        button.type = "button";
        button.dataset.photo = index;
        button.setAttribute("aria-label", `查看第 ${index + 1} 张照片`);
        button.addEventListener("click", (event) => {
          event.stopPropagation();
          setPhoto(Number(button.dataset.photo), Number(button.dataset.photo) > photoIndex ? 1 : -1);
        });
        return button;
      });

      photoDots.replaceChildren(...dots);
    }

    function renderInfo() {
      const active = destinations[activeIndex];
      airportCode.textContent = active.code;
      flightMood.textContent = active.flight;
      cityLabel.textContent = active.label;
      cityEnglish.textContent = active.city;
      const ingredientCards = active.ingredientIds.map((id) => {
        const ingredient = window.getIngredientData(id);
        const paragraph = document.createElement("p");
        paragraph.textContent = `${ingredient.emoji} ${ingredient.name} · ${ingredient.typeName}｜${ingredient.desc}`;
        return paragraph;
      });
      const guideCards = active.guide.map((item) => {
        const paragraph = document.createElement("p");
        paragraph.textContent = item;
        return paragraph;
      });
      guideList.replaceChildren(...ingredientCards, ...guideCards);
      flightDecision.textContent = active.decision;
      document.body.style.background = active.background;
      cabin.style.setProperty("--active", activeIndex);
      window.cityData = cityData;
    }

    function setPhoto(nextPhotoIndex, direction = 1) {
      const active = destinations[activeIndex];
      photoIndex = (nextPhotoIndex + active.photos.length) % active.photos.length;
      cabin.style.setProperty("--direction", direction);
      windowMask.classList.add("is-changing");
      window.setTimeout(() => {
        galleryImage.src = active.photos[photoIndex];
        galleryImage.alt = `${active.label} 建筑摄影`;
        renderDots();
        windowMask.classList.remove("is-changing");
      }, 220);
    }

    function setDestination(nextIndex, directionOverride = 0) {
      if (nextIndex === activeIndex) return;
      const direction = directionOverride || (nextIndex > activeIndex ? 1 : -1);
      activeIndex = (nextIndex + destinations.length) % destinations.length;
      photoIndex = 0;
      window.clearTimeout(transitionTimer);
      cabin.style.setProperty("--direction", direction);
      cabin.classList.add("is-moving");
      windowMask.classList.add("is-changing");
      infoPanel.classList.add("is-changing");

      window.setTimeout(() => {
        const active = destinations[activeIndex];
        galleryImage.src = active.photos[0];
        galleryImage.alt = `${active.label} 建筑摄影`;
        renderInfo();
        renderRail();
        renderDots();
        windowMask.classList.remove("is-changing");
        infoPanel.classList.remove("is-changing");
        preloadNearbyImages();
      }, 260);

      transitionTimer = window.setTimeout(() => {
        cabin.classList.remove("is-moving");
      }, 940);
    }

    function nextDestination() {
      setDestination((activeIndex + 1) % destinations.length, 1);
    }

    function previousDestination() {
      setDestination((activeIndex - 1 + destinations.length) % destinations.length, -1);
    }

    function preloadNearbyImages() {
      const active = destinations[activeIndex];
      const next = destinations[(activeIndex + 1) % destinations.length];
      const previous = destinations[(activeIndex - 1 + destinations.length) % destinations.length];
      [active, next, previous].forEach((destination) => {
        destination.photos.slice(0, 2).forEach((src) => {
          const image = new Image();
          image.src = src;
        });
      });
    }

    document.getElementById("nextDestination").addEventListener("click", nextDestination);
    document.getElementById("previousDestination").addEventListener("click", previousDestination);

    window.addEventListener("keydown", (event) => {
      if (event.key === "ArrowRight") nextDestination();
      if (event.key === "ArrowLeft") previousDestination();
    });

    cabin.addEventListener("wheel", (event) => {
      const intent = Math.abs(event.deltaX) > Math.abs(event.deltaY) ? event.deltaX : event.deltaY;
      if (Math.abs(intent) < 18 || wheelLocked) return;
      event.preventDefault();
      wheelLocked = true;
      if (intent > 0) nextDestination();
      if (intent < 0) previousDestination();
      window.setTimeout(() => {
        wheelLocked = false;
      }, 860);
    }, { passive: false });

    windowFrame.addEventListener("pointerdown", (event) => {
      dragStartX = event.clientX;
      windowFrame.setPointerCapture(event.pointerId);
    });

    windowFrame.addEventListener("pointerup", (event) => {
      if (dragStartX === null) return;
      const offset = event.clientX - dragStartX;
      dragStartX = null;
      if (offset < -72) nextDestination();
      if (offset > 72) previousDestination();
    });

    async function initGallery() {
      await window.whenDatabaseReady;
      galleryImage.src = destinations[0].photos[0];
      galleryImage.alt = `${destinations[0].label} 建筑摄影`;
      renderInfo();
      renderRail();
      renderDots();
      preloadNearbyImages();
      loadCityDataFromJson();
    }

    initGallery();
  </script>
</body>
</html>
