name: Deploy to Tencent COS

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install coscli
        run: |
          wget -q https://github.com/tencentyun/coscli/releases/download/v0.13.0-beta/coscli-linux -O coscli
          chmod +x coscli

      - name: Upload to COS
        env:
          SECRET_ID: ${{ secrets.TENCENT_SECRET_ID }}
          SECRET_KEY: ${{ secrets.TENCENT_SECRET_KEY }}
          BUCKET: ${{ secrets.COS_BUCKET }}
        run: |
          ./coscli sync . cos://$BUCKET/ \
            --secret-id $SECRET_ID \
            --secret-key $SECRET_KEY \
            --endpoint cos.ap-guangzhou.myqcloud.com \
            --delete \
            --exclude ".git/.*" \
            --exclude ".github/.*"
