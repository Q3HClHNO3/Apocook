<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>广州真实地图漫游</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="../database.js"></script>
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <style>
      :root {
        color-scheme: light;
        --ink: #1f2d35;
        --muted: #63737b;
        --paper: rgba(255, 255, 255, 0.72);
        --paper-strong: rgba(255, 255, 255, 0.9);
        --line: rgba(31, 45, 53, 0.12);
        --shadow: 0 22px 58px rgba(28, 46, 55, 0.18);
        --accent: #ff9f36;
        --green: #2aa66d;
        --font: "Avenir Next", "PingFang SC", "Microsoft YaHei", system-ui, sans-serif;
      }

      * {
        box-sizing: border-box;
      }

      html,
      body {
        width: 100%;
        height: 100%;
        margin: 0;
      }

      body {
        overflow: hidden;
        font-family: var(--font);
        color: var(--ink);
        background: #eef4f1;
        -webkit-font-smoothing: antialiased;
      }

      button,
      a {
        font: inherit;
        -webkit-tap-highlight-color: transparent;
      }

      .city-app,
      #map-container {
        position: fixed;
        top: 0;
        left: 0;
        width: 100vw;
        height: 100vh;
        overflow: hidden;
      }

      #map-container {
        position: fixed;
        top: 0;
        left: 0;
        width: 100vw;
        height: 100vh;
        overflow: hidden;
        z-index: 1;
        background: #eef4f1;
      }

      .leaflet-container {
        width: 100%;
        height: 100%;
        font-family: var(--font);
        background: #eef4f1;
      }

      .leaflet-tile-pane {
        filter: saturate(0.58) contrast(0.92) brightness(1.12);
      }

      .leaflet-control-attribution {
        border-radius: 8px 0 0 0;
        background: rgba(255, 255, 255, 0.58);
        backdrop-filter: blur(10px);
        color: rgba(31, 45, 53, 0.52);
        font-size: 10px;
      }

      .city-hotspot-icon {
        transition: opacity 260ms ease;
      }

      .return-btn {
        position: fixed;
        top: max(16px, env(safe-area-inset-top));
        left: max(16px, env(safe-area-inset-left));
        z-index: 700;
        display: inline-flex;
        align-items: center;
        gap: 8px;
        min-height: 42px;
        padding: 10px 14px;
        border: 1px solid rgba(255, 255, 255, 0.78);
        border-radius: 999px;
        color: var(--ink);
        text-decoration: none;
        font-size: 0.92rem;
        font-weight: 850;
        background: rgba(255, 255, 255, 0.58);
        backdrop-filter: blur(18px) saturate(1.2);
        box-shadow: 0 10px 28px rgba(28, 46, 55, 0.12);
      }

      .luggage-toggle {
        position: fixed;
        top: max(16px, env(safe-area-inset-top));
        right: max(16px, env(safe-area-inset-right));
        z-index: 700;
        display: grid;
        place-items: center;
        width: 54px;
        height: 54px;
        border: 1px solid rgba(255, 255, 255, 0.78);
        border-radius: 50%;
        background: rgba(255, 255, 255, 0.58);
        backdrop-filter: blur(18px) saturate(1.2);
        box-shadow: 0 14px 34px rgba(28, 46, 55, 0.13);
        color: var(--ink);
        font-size: 1.55rem;
        cursor: pointer;
      }

      .luggage-badge {
        position: absolute;
        top: -4px;
        right: -4px;
        display: grid;
        place-items: center;
        min-width: 23px;
        height: 23px;
        padding: 0 6px;
        border: 2px solid rgba(255, 255, 255, 0.94);
        border-radius: 999px;
        background: #ef5145;
        color: #fff;
        font-size: 0.72rem;
        font-weight: 950;
        line-height: 1;
      }

      .map-title {
        position: fixed;
        left: 50%;
        bottom: max(18px, env(safe-area-inset-bottom));
        z-index: 680;
        width: min(520px, calc(100vw - 32px));
        padding: 13px 16px;
        border: 1px solid rgba(255, 255, 255, 0.72);
        border-radius: 8px;
        background: rgba(255, 255, 255, 0.52);
        backdrop-filter: blur(18px) saturate(1.18);
        box-shadow: 0 16px 40px rgba(28, 46, 55, 0.1);
        text-align: center;
        transform: translateX(-50%);
        pointer-events: none;
      }

      .map-title h1 {
        margin: 0;
        font-size: clamp(1rem, 4vw, 1.2rem);
        line-height: 1.25;
      }

      .map-title p {
        margin: 5px 0 0;
        color: rgba(31, 45, 53, 0.66);
        font-size: 0.82rem;
        font-weight: 650;
        line-height: 1.45;
      }

      .chicken-marker {
        position: relative;
        width: 70px;
        height: 76px;
        pointer-events: none;
      }

      #chicken-avatar {
        position: absolute;
        left: 50%;
        top: 50%;
        width: 62px;
        height: 62px;
        border: 3px solid rgba(255, 255, 255, 0.95);
        border-radius: 50%;
        background:
          radial-gradient(circle at 40% 36%, #fff9cf 0 18%, transparent 19%),
          linear-gradient(145deg, #ffe98a, #ffd05d);
        box-shadow:
          0 15px 22px rgba(31, 45, 53, 0.16),
          inset 0 -5px 0 rgba(216, 146, 34, 0.12);
        --face-x: 1;
        transform: translate(-50%, -58%) scaleX(var(--face-x));
        transform-origin: 50% 72%;
        user-select: none;
      }

      .chicken-comb {
        position: absolute;
        top: -10px;
        left: 24px;
        width: 12px;
        height: 18px;
        border-radius: 999px 999px 5px 5px;
        background: #ff765f;
        box-shadow:
          -8px 5px 0 #ff907b,
          8px 5px 0 #ff907b;
      }

      .chicken-eye {
        position: absolute;
        top: 22px;
        left: 38px;
        width: 7px;
        height: 7px;
        border-radius: 50%;
        background: #21313a;
        box-shadow: 2px -1px 0 rgba(255, 255, 255, 0.9) inset;
      }

      .chicken-beak {
        position: absolute;
        top: 30px;
        left: 46px;
        width: 0;
        height: 0;
        border-top: 6px solid transparent;
        border-bottom: 6px solid transparent;
        border-left: 12px solid #ff9f36;
      }

      .chicken-shadow {
        position: absolute;
        left: 50%;
        bottom: 0;
        width: 42px;
        height: 12px;
        border-radius: 999px;
        background: rgba(31, 45, 53, 0.16);
        filter: blur(3px);
        transform: translateX(-50%);
      }

      .chicken-marker.is-running #chicken-avatar {
        animation: chickenRun 0.34s ease-in-out infinite;
      }

      .chicken-marker.is-pecking #chicken-avatar {
        animation: chickenPeck 0.13s ease-in-out 12;
      }

      .ingredient-marker {
        position: relative;
        display: grid;
        place-items: center;
        width: 46px;
        height: 46px;
        border: 0;
        border-radius: 50%;
        background: rgba(255, 255, 255, 0.62);
        box-shadow:
          0 10px 24px rgba(31, 45, 53, 0.14),
          0 0 0 1px rgba(255, 255, 255, 0.8) inset;
        backdrop-filter: blur(8px);
        cursor: pointer;
        transform-origin: 50% 80%;
        animation: ingredientFloat 2.6s ease-in-out infinite;
      }

      .ingredient-marker::after {
        content: attr(data-name);
        position: absolute;
        left: 50%;
        bottom: calc(100% + 8px);
        width: max-content;
        max-width: 160px;
        padding: 6px 9px;
        border-radius: 999px;
        color: var(--ink);
        background: rgba(255, 255, 255, 0.84);
        box-shadow: 0 10px 22px rgba(31, 45, 53, 0.12);
        font-size: 0.76rem;
        font-weight: 850;
        line-height: 1.2;
        opacity: 0;
        pointer-events: none;
        transform: translateX(-50%) translateY(4px);
        transition: opacity 150ms ease, transform 150ms ease;
      }

      .ingredient-marker:hover,
      .ingredient-marker:focus-visible {
        animation-play-state: paused;
        transform: scale(1.12);
        outline: none;
      }

      .ingredient-marker:hover::after,
      .ingredient-marker:focus-visible::after {
        opacity: 1;
        transform: translateX(-50%) translateY(0);
      }

      .ingredient-emoji {
        position: relative;
        z-index: 2;
        font-size: 27px;
        line-height: 1;
        filter: drop-shadow(0 3px 5px rgba(31, 45, 53, 0.12));
      }

      .ingredient-pulse {
        position: absolute;
        inset: 4px;
        border-radius: 50%;
        background: rgba(255, 214, 106, 0.24);
        animation: ingredientPulse 1.9s ease-out infinite;
      }

      .modal,
      .luggage-modal {
        position: fixed;
        inset: 0;
        z-index: 900;
        display: grid;
        place-items: center;
        padding: 18px;
        background: rgba(21, 36, 43, 0.24);
        opacity: 0;
        pointer-events: none;
        transition: opacity 180ms ease;
      }

      .modal.is-open,
      .luggage-modal.is-open {
        opacity: 1;
        pointer-events: auto;
      }

      .glass-card,
      .luggage-panel {
        width: min(520px, 100%);
        border: 1px solid rgba(255, 255, 255, 0.78);
        border-radius: 8px;
        background:
          linear-gradient(135deg, rgba(255, 255, 255, 0.84), rgba(245, 250, 247, 0.68)),
          rgba(255, 255, 255, 0.62);
        backdrop-filter: blur(26px) saturate(1.24);
        box-shadow: var(--shadow);
        overflow: hidden;
        transform: translateY(16px) scale(0.98);
        transition: transform 220ms ease;
      }

      .modal.is-open .glass-card,
      .luggage-modal.is-open .luggage-panel {
        transform: translateY(0) scale(1);
      }

      .card-top,
      .luggage-head {
        display: flex;
        align-items: flex-start;
        justify-content: space-between;
        gap: 14px;
        padding: 22px 22px 12px;
      }

      .type-badge {
        display: inline-flex;
        align-items: center;
        min-height: 28px;
        padding: 6px 10px;
        border-radius: 999px;
        color: #1d3528;
        background: rgba(188, 232, 204, 0.82);
        font-size: 0.8rem;
        font-weight: 900;
      }

      .close-btn {
        display: grid;
        place-items: center;
        flex: 0 0 auto;
        width: 36px;
        height: 36px;
        border: 1px solid var(--line);
        border-radius: 50%;
        background: rgba(255, 255, 255, 0.66);
        color: var(--ink);
        font-size: 1.4rem;
        line-height: 1;
        cursor: pointer;
      }

      .card-body {
        padding: 0 22px 22px;
      }

      .card-title,
      .luggage-title {
        margin: 0;
        color: var(--ink);
        font-size: clamp(1.7rem, 6vw, 2.7rem);
        line-height: 1.08;
        letter-spacing: 0;
      }

      .card-description {
        margin: 14px 0 0;
        color: rgba(31, 45, 53, 0.72);
        font-size: 1rem;
        font-weight: 620;
        line-height: 1.75;
        white-space: pre-line;
      }

      .collect-btn,
      .return-kitchen-btn,
      .remove-btn {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 8px;
        min-height: 48px;
        margin-top: 22px;
        border: 0;
        border-radius: 8px;
        color: #2d1d09;
        background: linear-gradient(135deg, #ffd76a, #ffaa66);
        box-shadow: 0 16px 26px rgba(255, 159, 54, 0.2);
        font-weight: 950;
        cursor: pointer;
      }

      .collect-btn,
      .return-kitchen-btn {
        width: 100%;
      }

      .toast {
        position: fixed;
        left: 50%;
        bottom: 16vh;
        z-index: 980;
        width: max-content;
        max-width: min(520px, calc(100vw - 36px));
        padding: 12px 16px;
        border-radius: 999px;
        color: #2d1d09;
        background: rgba(255, 216, 106, 0.95);
        box-shadow: 0 18px 40px rgba(31, 45, 53, 0.16);
        font-weight: 900;
        text-align: center;
        opacity: 0;
        pointer-events: none;
        transform: translate(-50%, 18px) scale(0.96);
      }

      .toast.is-showing {
        animation: toastFloat 2.25s ease forwards;
      }

      .luggage-panel {
        width: min(430px, 100%);
      }

      .luggage-eyebrow {
        margin: 0 0 5px;
        color: rgba(31, 45, 53, 0.54);
        font-size: 0.76rem;
        font-weight: 950;
        letter-spacing: 0.1em;
      }

      .luggage-list {
        display: grid;
        gap: 9px;
        max-height: min(330px, 46vh);
        margin: 0;
        padding: 10px 22px 20px;
        overflow: auto;
        list-style: none;
      }

      .luggage-item,
      .luggage-empty {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
        min-height: 42px;
        padding: 10px 12px;
        border: 1px solid rgba(31, 45, 53, 0.1);
        border-radius: 7px;
        background: rgba(255, 255, 255, 0.5);
        color: var(--ink);
        font-weight: 850;
      }

      .luggage-empty {
        justify-content: center;
        color: var(--muted);
        text-align: center;
        line-height: 1.45;
      }

      .luggage-id {
        color: rgba(31, 45, 53, 0.56);
        font-size: 0.78rem;
        font-weight: 800;
      }

      .remove-btn {
        flex: 0 0 auto;
        min-height: 34px;
        margin-top: 0;
        padding: 7px 10px;
        border: 1px solid rgba(239, 81, 69, 0.18);
        border-radius: 999px;
        color: #9f362f;
        background: rgba(255, 239, 234, 0.86);
        box-shadow: none;
        font-size: 0.78rem;
      }

      .luggage-actions {
        padding: 0 22px 22px;
      }

      @keyframes chickenRun {
        0%,
        100% {
          transform: translate(-50%, -58%) scaleX(var(--face-x)) rotate(-2deg);
        }
        50% {
          transform: translate(-50%, -66%) scaleX(var(--face-x)) rotate(3deg);
        }
      }

      @keyframes chickenPeck {
        0%,
        100% {
          transform: translate(-50%, -58%) scaleX(var(--face-x)) scaleY(1);
        }
        48% {
          transform: translate(-50%, -40%) scaleX(var(--face-x)) scaleY(0.78);
        }
      }

      @keyframes ingredientFloat {
        0%,
        100% {
          translate: 0 0;
        }
        50% {
          translate: 0 -7px;
        }
      }

      @keyframes ingredientPulse {
        0% {
          opacity: 0.72;
          transform: scale(0.72);
        }
        100% {
          opacity: 0;
          transform: scale(1.55);
        }
      }

      @keyframes toastFloat {
        0% {
          opacity: 0;
          transform: translate(-50%, 18px) scale(0.96);
        }
        16%,
        72% {
          opacity: 1;
          transform: translate(-50%, 0) scale(1);
        }
        100% {
          opacity: 0;
          transform: translate(-50%, -42px) scale(0.98);
        }
      }

      @media (max-width: 640px) {
        .return-btn {
          max-width: calc(100vw - 92px);
          min-height: 40px;
          padding: 9px 12px;
          font-size: 0.84rem;
        }

        .luggage-toggle {
          width: 50px;
          height: 50px;
        }

        .map-title {
          bottom: max(12px, env(safe-area-inset-bottom));
          padding: 11px 13px;
        }

        .ingredient-marker {
          width: 42px;
          height: 42px;
        }

        .ingredient-emoji {
          font-size: 25px;
        }
      }
    </style>
  </head>
  <body>
    <main class="city-app" aria-label="真实城市交互地图">
      <div id="map-container" aria-label="真实城市地图"></div>
      <a class="return-btn" href="flightBoard.html" aria-label="返回机场大屏">← 返回机场大屏</a>
      <button class="luggage-toggle" id="luggageToggle" type="button" aria-label="查看阿婆的行李箱">
        🧳
        <span class="luggage-badge" id="luggageBadge">0</span>
      </button>
      <section class="map-title" aria-live="polite">
        <h1 id="mapTitle">广州真实地图漫游</h1>
        <p>点击地图上的食材，走地鸡会跑过去啄一口，再把故事带给你。</p>
      </section>
    </main>

    <div class="modal" id="modal" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
      <article class="glass-card">
        <div class="card-top">
          <span class="type-badge" id="modalType">地道食材</span>
          <button class="close-btn" id="closeModal" type="button" aria-label="关闭弹窗">×</button>
        </div>
        <div class="card-body">
          <h2 class="card-title" id="modalTitle">Title</h2>
          <p class="card-description" id="modalDescription">Description</p>
          <button class="collect-btn" id="collectBtn" type="button">放进行李箱</button>
        </div>
      </article>
    </div>

    <div class="toast" id="toast" role="status" aria-live="polite">食材已放进行李箱！</div>

    <div class="luggage-modal" id="luggageModal" role="dialog" aria-modal="true" aria-labelledby="luggageTitle">
      <section class="luggage-panel">
        <div class="luggage-head">
          <div>
            <p class="luggage-eyebrow">MY LUGGAGE</p>
            <h2 class="luggage-title" id="luggageTitle">阿婆的行李箱</h2>
          </div>
          <button class="close-btn" id="closeLuggage" type="button" aria-label="关闭行李箱">×</button>
        </div>
        <ul class="luggage-list" id="luggageList"></ul>
        <div class="luggage-actions">
          <button class="return-kitchen-btn" id="returnKitchenBtn" type="button">结束旅行，打包回阿婆厨房</button>
        </div>
      </section>
    </div>

    <script>
      const kitchenUrl = "../ApoCHEF-Kitchen/kitchen.html";
      const markerByStopId = new Map();
      const modal = document.getElementById("modal");
      const modalType = document.getElementById("modalType");
      const modalTitle = document.getElementById("modalTitle");
      const modalDescription = document.getElementById("modalDescription");
      const closeModal = document.getElementById("closeModal");
      const collectBtn = document.getElementById("collectBtn");
      const toast = document.getElementById("toast");
      const luggageToggle = document.getElementById("luggageToggle");
      const luggageBadge = document.getElementById("luggageBadge");
      const luggageModal = document.getElementById("luggageModal");
      const luggageList = document.getElementById("luggageList");
      const closeLuggage = document.getElementById("closeLuggage");
      const returnKitchenBtn = document.getElementById("returnKitchenBtn");
      const mapContainer = document.getElementById("map-container");
      const mapTitle = document.getElementById("mapTitle");
      const mapSubtitle = document.querySelector(".map-title p");

      let activeHotspot = null;
      let activeMoveFrame = 0;
      let activePeckTimer = 0;
      let map = null;
      let chickenMarker = null;
      let currentCity = null;

      function normalizeCityKey(value) {
        return String(value || "")
          .toLowerCase()
          .replace(/\s+/g, "")
          .replace(/-/g, "");
      }

      async function loadCityRoutes() {
        await window.whenDatabaseReady;
        if (window.APP_DATA?.cityRoutes) return window.APP_DATA.cityRoutes;

        const response = await fetch("../data/cityRoutes.json");
        if (!response.ok) {
          throw new Error("无法加载 data/cityRoutes.json");
        }
        return response.json();
      }

      function readLuggage() {
        try {
          const luggage = JSON.parse(localStorage.getItem("my_luggage") || "[]");
          return Array.isArray(luggage) ? luggage : [];
        } catch (error) {
          return [];
        }
      }

      function writeLuggage(luggage) {
        localStorage.setItem("my_luggage", JSON.stringify(luggage));
      }

      function escapeHtml(value) {
        return String(value).replace(/[&<>"']/g, (char) => ({
          "&": "&amp;",
          "<": "&lt;",
          ">": "&gt;",
          '"': "&quot;",
          "'": "&#39;"
        })[char]);
      }

      function readIngredientData(id) {
        return window.getIngredientData?.(id) || {
          id,
          name: id,
          emoji: "🍽️",
          type: "food",
          typeName: "地道食材",
          desc: ""
        };
      }

      function getHotspotName(id) {
        return readIngredientData(id).name || id;
      }

      function updateLuggageBadge(count = readLuggage().length) {
        luggageBadge.textContent = String(count);
      }

      function renderLuggageList() {
        const luggage = readLuggage();

        if (!luggage.length) {
          luggageList.innerHTML = '<li class="luggage-empty">行李箱还是空的，去地图上找一点能让阿婆点头的食材吧。</li>';
          return;
        }

        luggageList.innerHTML = luggage
          .map((id, index) => `
            <li class="luggage-item">
              <span>
                <span>${escapeHtml(getHotspotName(id))}</span><br />
                <span class="luggage-id">${escapeHtml(id)}</span>
              </span>
              <button class="remove-btn" type="button" data-luggage-index="${index}" aria-label="原地吃掉${escapeHtml(getHotspotName(id))}">🍽️ 原地吃掉</button>
            </li>
          `)
          .join("");
      }

      function removeLuggageItem(index) {
        const my_luggage = readLuggage();
        if (index < 0 || index >= my_luggage.length) return;

        my_luggage.splice(index, 1);
        localStorage.setItem("my_luggage", JSON.stringify(my_luggage));
        renderLuggageList();
        updateLuggageBadge(my_luggage.length);
      }

      function createHotspots(cityKey, city) {
        return (city.stops || []).map((stop) => {
          const ingredient = readIngredientData(stop.ingredientId);

          return {
            ...stop,
            cityKey,
            id: stop.ingredientId,
            stopId: stop.id,
            ingredientId: stop.ingredientId,
            type: ingredient.type || "food",
            typeName: ingredient.typeName || "地道食材",
            emoji: ingredient.emoji || "🍽️",
            name: ingredient.name || stop.ingredientId,
            desc: ingredient.desc || ingredient.description || "",
            story: ingredient.story || ""
          };
        });
      }

      function makeIngredientIcon(hotspot) {
        return L.divIcon({
          className: "city-hotspot-icon",
          iconSize: [46, 46],
          iconAnchor: [23, 36],
          html: `
            <div class="ingredient-marker" role="button" tabindex="0" data-name="${escapeHtml(hotspot.name)}" aria-label="${escapeHtml(hotspot.name)}">
              <span class="ingredient-pulse"></span>
              <span class="ingredient-emoji">${escapeHtml(hotspot.emoji)}</span>
            </div>
          `
        });
      }

      function attachIngredientDomEvents(marker, hotspot) {
        const element = marker.getElement();
        if (!element) return;

        const trigger = (event) => {
          event.preventDefault();
          event.stopPropagation();
          L.DomEvent.stop(event);
          runChickenToHotspot(hotspot);
        };

        element.addEventListener("click", trigger);
        element.addEventListener("keydown", (event) => {
          if (event.key === "Enter" || event.key === " ") {
            trigger(event);
          }
        });
      }

      function updateHotspotVisibility() {
        if (!map) return;
        const isVisible = map.getZoom() >= 7;
        markerByStopId.forEach((marker) => {
          const element = marker.getElement();
          if (!element) return;
          element.style.opacity = isVisible ? "1" : "0";
          element.style.pointerEvents = isVisible ? "auto" : "none";
        });
      }

      function createIngredientMarkers(hotspots) {
        const luggage = readLuggage();

        hotspots.forEach((hotspot) => {
          if (luggage.includes(hotspot.ingredientId)) return;

          const marker = L.marker([hotspot.lat, hotspot.lng], {
            icon: makeIngredientIcon(hotspot),
            zIndexOffset: 500
          }).addTo(map);

          marker.on("click", (event) => {
            L.DomEvent.stop(event);
            runChickenToHotspot(hotspot);
          });

          marker.on("add", () => {
            attachIngredientDomEvents(marker, hotspot);
            updateHotspotVisibility();
          });
          attachIngredientDomEvents(marker, hotspot);
          markerByStopId.set(hotspot.stopId, marker);
        });

        updateHotspotVisibility();
      }

      function focusCity(city) {
        if (!city) return;

        document.title = city.title;
        mapTitle.textContent = city.title;
        mapContainer.setAttribute("aria-label", `${city.displayName} 行星聚焦漫游地图`);
        chickenMarker.setLatLng(city.center);

        setTimeout(() => {
          map.flyTo(city.center, city.zoom, {
            duration: 2.5,
            easeLinearity: 0.25
          });
        }, 500);
      }

      function getChickenElement() {
        return document.getElementById("chickenMarker");
      }

      function setChickenRunning(isRunning) {
        getChickenElement()?.classList.toggle("is-running", isRunning);
      }

      function setChickenPecking(isPecking) {
        getChickenElement()?.classList.toggle("is-pecking", isPecking);
      }

      function setChickenDirection(fromLatLng, toLatLng) {
        const fromPoint = map.latLngToContainerPoint(fromLatLng);
        const toPoint = map.latLngToContainerPoint(toLatLng);
        const avatar = document.getElementById("chicken-avatar");
        if (avatar) {
          avatar.style.setProperty("--face-x", toPoint.x >= fromPoint.x ? "1" : "-1");
        }
      }

      function easeInOutCubic(t) {
        return t < 0.5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2;
      }

      function moveChickenSmoothly(targetLatLng, onArrive) {
        window.cancelAnimationFrame(activeMoveFrame);
        window.clearTimeout(activePeckTimer);
        setChickenPecking(false);

        const startLatLng = chickenMarker.getLatLng();
        const distance = map.distance(startLatLng, targetLatLng);
        const duration = Math.min(2200, Math.max(700, distance * 10));
        const startedAt = performance.now();

        setChickenDirection(startLatLng, targetLatLng);
        setChickenRunning(true);

        function tick(now) {
          const progress = Math.min(1, (now - startedAt) / duration);
          const eased = easeInOutCubic(progress);
          const lat = startLatLng.lat + (targetLatLng.lat - startLatLng.lat) * eased;
          const lng = startLatLng.lng + (targetLatLng.lng - startLatLng.lng) * eased;

          chickenMarker.setLatLng([lat, lng]);

          if (progress < 1) {
            activeMoveFrame = window.requestAnimationFrame(tick);
            return;
          }

          setChickenRunning(false);
          onArrive();
        }

        activeMoveFrame = window.requestAnimationFrame(tick);
      }

      function runChickenToHotspot(hotspot) {
        activeHotspot = hotspot;
        modal.classList.remove("is-open");
        const targetLatLng = L.latLng(hotspot.lat, hotspot.lng);

        moveChickenSmoothly(targetLatLng, () => {
          setChickenPecking(true);
          activePeckTimer = window.setTimeout(() => {
            setChickenPecking(false);
            openHotspotModal(hotspot);
          }, 980);
        });
      }

      function openHotspotModal(hotspot) {
        modalType.textContent = hotspot.typeName;
        modalTitle.textContent = hotspot.name;
        modalDescription.textContent = hotspot.story ? `${hotspot.desc}\n\n${hotspot.story}` : hotspot.desc;
        collectBtn.dataset.ingredientId = hotspot.ingredientId;
        collectBtn.dataset.stopId = hotspot.stopId;
        modal.classList.add("is-open");
        closeModal.focus({ preventScroll: true });
      }

      function closeHotspotModal() {
        modal.classList.remove("is-open");
      }

      function collectActiveIngredient() {
        const ingredientId = collectBtn.dataset.ingredientId || activeHotspot?.ingredientId;
        const stopId = collectBtn.dataset.stopId || activeHotspot?.stopId;
        if (!ingredientId) return;

        const luggage = readLuggage();
        if (!luggage.includes(ingredientId)) {
          luggage.push(ingredientId);
          writeLuggage(luggage);
        }

        const marker = markerByStopId.get(stopId);
        if (marker) {
          map.removeLayer(marker);
          markerByStopId.delete(stopId);
        }

        updateLuggageBadge(luggage.length);
        closeHotspotModal();
        activeHotspot = null;
        toast.classList.remove("is-showing");
        void toast.offsetWidth;
        toast.classList.add("is-showing");
      }

      function openLuggage() {
        renderLuggageList();
        luggageModal.classList.add("is-open");
        closeLuggage.focus({ preventScroll: true });
      }

      function closeLuggageModal() {
        luggageModal.classList.remove("is-open");
      }

      function openCustomTripPointPopup(latlng) {
        console.log("预留行程规划弹窗接口", {
          lat: Number(latlng.lat.toFixed(6)),
          lng: Number(latlng.lng.toFixed(6))
        });
      }

      function bindEvents() {
        map.on("click", (event) => {
          console.log(`自定义行程点 lat: ${event.latlng.lat.toFixed(6)}, lng: ${event.latlng.lng.toFixed(6)}`);
          openCustomTripPointPopup(event.latlng);
        });
        map.on("zoomend", updateHotspotVisibility);

        closeModal.addEventListener("click", closeHotspotModal);
        collectBtn.addEventListener("click", collectActiveIngredient);
        luggageToggle.addEventListener("click", openLuggage);
        closeLuggage.addEventListener("click", closeLuggageModal);
        luggageList.addEventListener("click", (event) => {
          const button = event.target.closest(".remove-btn");
          if (!button) return;
          removeLuggageItem(Number(button.dataset.luggageIndex));
        });
        returnKitchenBtn.addEventListener("click", () => {
          window.location.href = kitchenUrl;
        });

        modal.addEventListener("click", (event) => {
          if (event.target === modal) closeHotspotModal();
        });

        luggageModal.addEventListener("click", (event) => {
          if (event.target === luggageModal) closeLuggageModal();
        });

        window.addEventListener("keydown", (event) => {
          if (event.key === "Escape") {
            closeHotspotModal();
            closeLuggageModal();
          }
        });

        window.addEventListener("focus", () => updateLuggageBadge());
        window.addEventListener("storage", (event) => {
          if (event.key === "my_luggage") updateLuggageBadge();
        });

        window.addEventListener("resize", () => {
          window.setTimeout(() => map.invalidateSize(), 120);
        });
      }

      async function initCityMap() {
        try {
          await window.whenDatabaseReady;
          const routes = await loadCityRoutes();
          const cities = routes.cities || {};

          const urlParams = new URLSearchParams(window.location.search);
          const rawCity = urlParams.get("city") || "Guangzhou";
          const cityKey =
            Object.keys(cities).find((key) => normalizeCityKey(key) === normalizeCityKey(rawCity)) || "Guangzhou";

          currentCity = cities[cityKey] || cities.Guangzhou;
          const hotspots = createHotspots(cityKey, currentCity);

          map = L.map("map-container", {
            center: [20, 0],
            zoom: 2,
            zoomControl: false,
            attributionControl: true,
            preferCanvas: true
          });
          map.setView([20, 0], 2);

          L.tileLayer("https://{s}.basemaps.cartocdn.com/light_all/{z}/{x}/{y}{r}.png", {
            attribution: "&copy; OpenStreetMap &copy; CARTO",
            subdomains: "abcd",
            maxZoom: 20
          }).addTo(map);
          setTimeout(() => {
            map.invalidateSize();
          }, 200);

          const chickenIcon = L.divIcon({
            className: "",
            iconSize: [70, 76],
            iconAnchor: [35, 58],
            html: `
              <div class="chicken-marker" id="chickenMarker">
                <span class="chicken-shadow"></span>
                <div id="chicken-avatar" aria-label="主厨走地鸡" role="img">
                  <span class="chicken-comb"></span>
                  <span class="chicken-eye"></span>
                  <span class="chicken-beak"></span>
                </div>
              </div>
            `
          });

          chickenMarker = L.marker([20, 0], {
            icon: chickenIcon,
            interactive: false,
            zIndexOffset: 1000
          }).addTo(map);

          bindEvents();
          document.title = currentCity.title || `${currentCity.displayName} 行星聚焦漫游`;
          mapTitle.textContent = currentCity.title || `${currentCity.displayName} 行星聚焦漫游`;
          mapContainer.setAttribute("aria-label", `${currentCity.displayName} 行星聚焦漫游地图`);

          if (hotspots.length) {
            mapSubtitle.textContent = "点击地图上的食材，走地鸡会跑过去啄一口，再把故事带给你。";
            createIngredientMarkers(hotspots);
          } else {
            mapSubtitle.textContent = "这座城市还没有被阿婆标记食材，之后再来搜刮。";
          }

          updateLuggageBadge();
          focusCity(currentCity);
        } catch (error) {
          console.error(error);
          mapTitle.textContent = "地图路线加载失败";
          mapSubtitle.textContent = error.message || "无法加载 data/cityRoutes.json";
        }
      }

      initCityMap();
    </script>
  </body>
</html>
